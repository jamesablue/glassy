name: Feature request
description: Suggest an idea or an improvement for Glassy.
title: 'feat: '
labels: [enhancement, 'type:feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Sketches and examples welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked the roadmap issues (label `roadmap`) and this is not already planned.
          required: true
