# Takes new screenshot baselines for e2e/visual.spec.ts in the Playwright Linux image that CI
# compares them in, for when Docker is not at hand (`npm run e2e:visual:update` does the same
# locally). Run it on a branch, download the visual-baselines artifact and commit its files to
# e2e/visual.spec.ts-snapshots/ on that branch. See e2e/README.md.
name: Update screenshots

on:
  workflow_dispatch:

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  version:
    name: Read the Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Playwright version from the lockfile
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  update:
    name: Take new baselines
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright-version }}-noble
      options: --ipc=host
    env:
      E2E_VISUAL: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Take the screenshots
        run: npx playwright test --update-snapshots=all

      - name: Upload the new baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7
