# Every check is its own job, so they run side by side:
#
# - Quality, Unit tests, Build, Backend, Infrastructure (CDK) and Lint workflows start at once.
# - E2E shard 1/2, E2E shard 2/2 and E2E visual test the app Build made.
# - E2E merges their reports into one, and passes only when all three passed.
#
# docs/testing.md describes what each job checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older runs; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  NG_CLI_ANALYTICS: 'false'

defaults:
  run:
    # Named explicitly so pipes fail too (bash -eo pipefail).
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Each check runs even when the one before it failed, so one run reports every problem.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type check (app, unit tests, e2e, scripts)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Fails when a layer drops below its coverage floor (vitest-base.config.mts).
      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Coverage summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/ci/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/glassy/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # The end-to-end jobs pick their browsers (and the visual job its image) by this version.
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Fails when the initial bundle or a component style is over budget (angular.json).
      - name: Build (production)
        run: npm run build 2>&1 | tee build.log

      - name: Bundle size summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/ci/bundle-summary.ts build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the build for the end-to-end tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/glassy/browser/
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: E2E shard ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/glassy/browser/

      # Playwright downloads a browser build for each OS release, so the cache key names the
      # runner's release (ImageOS: ubuntu24, ubuntu26…) as well as the Playwright version.
      - name: Read the runner's OS release
        id: runner
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.runner.outputs.os }}-${{ runner.arch }}-${{ needs.build.outputs.playwright-version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      # The cache holds the browser only; its system libraries come from apt.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # CI is set, so Playwright serves dist/ (e2e/support/serve-build.mts), retries a failed
      # test once with a trace, and writes a blob report for the E2E job to merge.
      - name: End-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  visual:
    name: E2E visual
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Screenshots only match where the baselines were taken: the Playwright image for the
    # installed version, the same one `npm run e2e:visual` uses locally.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright-version }}-noble
      options: --ipc=host
    env:
      E2E_VISUAL: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/glassy/browser/

      # On a mismatch the report has the expected, actual and diff images; see e2e/README.md
      # for updating the baselines.
      - name: Visual regression tests
        run: npx playwright test

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-visual
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  e2e-report:
    name: E2E
    needs: [build, e2e, visual]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        if: needs.build.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: needs.build.result == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download blob reports
        if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge into one HTML report
        if: needs.build.result == 'success'
        env:
          PLAYWRIGHT_VERSION: ${{ needs.build.outputs.playwright-version }}
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" merge-reports --config playwright.merge.config.ts --reporter html ./all-blob-reports

      - name: Upload HTML report
        if: needs.build.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # The one check to require for the end-to-end tests: it passes only when every shard and
      # the visual run passed.
      - name: Check every end-to-end job passed
        env:
          SHARDS: ${{ needs.e2e.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          echo "Shards: $SHARDS. Visual: $VISUAL."
          if [ "$SHARDS" != success ] || [ "$VISUAL" != success ]; then
            echo "::error title=End-to-end tests failed::Shards: $SHARDS, visual: $VISUAL. The playwright-report artifact has the details."
            exit 1
          fi

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      # Synth needs no AWS account. Skip the credential lookups and telemetry.
      AWS_EC2_METADATA_DISABLED: 'true'
      CDK_DISABLE_CLI_TELEMETRY: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The ingest Lambda is bundled with backend/'s esbuild, in every synth and test.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Also type checks (tsc runs before the app) and fails on any cdk-nag
      # finding that has not been acknowledged.
      - name: Synthesize
        run: npm run synth

  # The forecast ingest in backend/ and the snapshot contract in shared/. Their lint and format run
  # in the Quality job, with the app's.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Type check (backend, shared)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit tests (backend, shared)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # The command the end-to-end tests and local development use, with no network.
      - name: Build a snapshot from the recorded fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run snapshot:fixtures -- --out "$RUNNER_TEMP/forecast.json"

  # Checks every workflow, including the ones that only run by hand (deploy-aws.yml) or on a
  # schedule, and the shell in them (shellcheck), instead of finding mistakes on their first run.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
