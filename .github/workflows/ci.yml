name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    env:
      # Synth needs no AWS account. Skip the credential lookups and telemetry.
      AWS_EC2_METADATA_DISABLED: 'true'
      CDK_DISABLE_CLI_TELEMETRY: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Also type checks (tsc runs before the app) and fails on any cdk-nag
      # finding that has not been acknowledged.
      - name: Synthesize
        run: npm run synth

      # deploy-aws.yml only runs by hand, so check it (and the shell in it)
      # here instead of finding mistakes on the first deploy.
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
