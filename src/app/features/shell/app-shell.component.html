<glassy-brand-badge />

<glassy-panel class="side" role="complementary" aria-label="Snorkel spots">
  <glassy-spot-ranking-panel [hidden]="detailOpen()" />
  <!-- Loaded the first time a spot opens (or ahead of time when the browser is idle). -->
  @defer (when detailOpen(); prefetch on idle) {
    @if (detailOpen()) {
      <glassy-spot-detail-panel />
    }
  } @loading {
    <p class="side-loading">Loading…</p>
  }
</glassy-panel>

<glassy-layer-menu />
<glassy-units-popover />
<glassy-about-popover />
<glassy-legend [spec]="legendSpec()" />
<glassy-timeline />

<glassy-status-messages />
<glassy-hour-announcer />
