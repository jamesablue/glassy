<glassy-map (mapClick)="inspect($event)">
  <glassy-basemap-layer />
  <glassy-terrain-layer [mode]="surfaceMode()" />
  <glassy-scalar-field-layer
    [field]="field()"
    [grid]="grid()"
    [palette]="palette()"
    [hour]="hour()"
  />
  <glassy-depth-layer [visible]="mapUi.isDepth()" />
  <glassy-particle-layer
    [vectors]="vectors()"
    [grid]="grid()"
    [hour]="hour()"
    [mode]="surfaceMode()"
    [enabled]="mapUi.particlesOn()"
  />
  @if (mapUi.spotsOn()) {
    <glassy-spot-markers [pins]="conditions.spotPins()" (pinSelect)="selectSpot($event)" />
  }
  <glassy-point-inspector />
</glassy-map>

<header class="brand">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="15" fill="#0b1220" stroke="rgba(255,255,255,.25)" />
    <path
      d="M5 18c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2 2-1 2-1"
      fill="none"
      stroke="#5eead4"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <path
      d="M8 23c2 0 2-1.4 4-1.4S14 23 16 23s2-1.4 4-1.4 2 1.4 4 1.4"
      fill="none"
      stroke="#38bdf8"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity=".8"
    />
    <circle cx="21" cy="10" r="3" fill="#fbbf24" />
  </svg>
  <div>
    <h1 class="brand-name">{{ name }}</h1>
    <p class="brand-sub">{{ tagline }}</p>
  </div>
</header>
<router-outlet />
