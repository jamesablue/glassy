<glassy-map (mapClick)="inspect($event)">
  <glassy-basemap-layer />
  <glassy-terrain-layer [mode]="surfaceMode()" />
  <glassy-scalar-field-layer
    [field]="field()"
    [grid]="grid()"
    [palette]="palette()"
    [hour]="hour()"
  />
  <glassy-depth-layer [visible]="mapUi.isDepth()" />
  <glassy-particle-layer
    [vectors]="vectors()"
    [grid]="grid()"
    [hour]="hour()"
    [mode]="surfaceMode()"
    [enabled]="mapUi.particlesOn()"
  />
  @if (mapUi.spotsOn()) {
    <glassy-spot-markers
      [pins]="conditions.spotPins()"
      [hoveredId]="mapUi.hoveredSpotId()"
      (pinSelect)="selectSpot($event)"
      (pinHover)="hoverSpot($event)"
    />
  }
  <glassy-point-inspector />
</glassy-map>

<glassy-app-shell />
